services:
  app:
    build: .
    volumes:
      - ./data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/server/data
    restart: unless-stopped
    networks:
      - homelab
    labels:
      - traefik.enable=true
      - traefik.http.routers.tournament.rule=Host(`tournament.localhost`)
      - traefik.http.services.tournament.loadbalancer.server.port=3000
      - traefik.docker.network=homelab

networks:
  homelab:
    external: true
